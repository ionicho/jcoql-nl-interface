# PROVA C: LoRA su tutti i livelli lineari (q,k,v,o,gate,up,down), rango 16.
# Stessa forma della corsa v3 (max_length 1280, batch 1), su 160 esempi (~3 min). Si lancia da questa cartella.
base: meta-llama/Llama-3.1-8B-Instruct
task: sft

data:
  train: ./probe.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 1280

training:
  epochs: 1
  lr: 2e-4
  batch_size: 1
  gradient_checkpointing: true
  stream_layers: true
  lora:
    r: 16
    alpha: 32
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  quantization: 4bit

output: ./output_probe_all
